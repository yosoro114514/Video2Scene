<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频场景 · 精修对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101a20;color:#e4e9eb;font:14px/1.6 system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #34424a;display:flex;gap:24px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}a{color:#90d6c2}button,select{background:#25363f;color:#f3f5f7;border:1px solid #4a626f;border-radius:7px;padding:8px 12px;margin:3px;font:inherit;cursor:pointer}main{display:grid;grid-template-columns:minmax(440px,1.3fr) minmax(350px,1fr);gap:16px;padding:18px}.panel{border:1px solid #35444d;border-radius:10px;overflow:hidden;background:#18262d}.bar{padding:10px 14px;background:#21313a;display:flex;gap:6px;align-items:center;flex-wrap:wrap}#stage{height:65vh;min-height:380px;position:relative}canvas{display:block}#source,#render{width:50%;object-fit:contain;vertical-align:top}.pair{display:flex;background:#080d10}#detail,#comparison{width:100%;display:block}p{margin:9px 14px;color:#aebdc4}footer{padding:16px 24px;color:#9aadb7}.wide{grid-column:1/-1}#status{position:absolute;top:8px;left:14px;color:#32514d;background:#ffffffdb;padding:4px 9px;border-radius:5px}@media(max-width:900px){main{display:block;padding:10px}.panel{margin-bottom:12px}#stage{height:52vh}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body>
<header><h1 id="title">视频场景 · 精修对照</h1><a id="native" download>Blender 工程</a><a href="model.glb" download>GLB</a><a href="comparison.jpg">多视角总览</a><a href="refinement_notes.md">修改记录</a></header>
<main><section class="panel"><div class="bar"><button id="free">整体浏览</button><button id="match">原视频相机</button><select id="version"><option value="after">精修版</option><option value="before">原版</option></select><select id="frame"></select></div><div id="stage"><span id="status">正在加载模型…</span></div><p>拖动旋转，滚轮缩放。原视频相机模式保持源画幅；切换版本可直接比较形状和布局。</p></section>
<section class="panel"><div class="bar" id="pairTitle">原视频 / 精修回渲染</div><div class="pair"><img id="source" alt="原视频帧"><img id="render" alt="原相机渲染"></div><div class="bar"><select id="asset"><option value="">选择物体，查看多视角局部对照</option></select></div><a id="detailLink" target="_blank"><img id="detail" alt="物体局部对照"></a><p id="coverage"></p></section>
<section class="panel wide"><div class="bar"><span id="comparisonTitle">同一相机：原视频 / 修改前 / 修改后</span> <button id="overlay">显示叠加</button></div><a id="comparisonLink" target="_blank"><img id="comparison" alt="当前视角对照"></a></section></main>
<footer>尺寸来自单目几何估计。局部细节和不可见结构仍含建模假设；原帧、拟合残差和剩余问题随工程保存。</footer>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=s=>document.querySelector(s),data=await(await fetch('viewer_data.json')).json();const afterLabel=data.sample==='video_scene'?'自动初模':data.sample==='video_scene_codex'?'GPT 复核版':'精修版';$('#title').textContent=data.sample+' · '+afterLabel+'对照';$('#version option[value=after]').textContent=afterLabel;$('#pairTitle').textContent='原视频 / '+afterLabel+'回渲染';$('#comparisonTitle').textContent=data.before?'同一相机：原视频 / 修改前 / 修改后':'同一相机：原视频 / 自动初模';$('#native').href=data.native;for(const i of data.frames)$('#frame').add(new Option('Frame '+i,i));for(const a of data.assets)$('#asset').add(new Option(a.id,a.id));if(!data.before)$('#version').lastElementChild.remove();
const host=$('#stage'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xdce3e5);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x778089,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,6,3);scene.add(light);
const loader=new GLTFLoader(),models={};let matched=false,overlay=false,box;
async function load(which){if(!models[which]){const result=await loader.loadAsync(which==='before'?data.before:'model.glb');models[which]=result.scene;scene.add(result.scene)}for(const k in models)models[k].visible=k===which;box=new THREE.Box3();models[which].updateMatrixWorld(true);models[which].traverse(o=>{if(o.isMesh&&!/floor|wall|reference/i.test(o.name))box.expandByObject(o)});if(box.isEmpty())box.setFromObject(models[which]);$('#status').textContent=which==='before'?'原版':afterLabel}
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);if(matched){const c=data.cameras.find(c=>c.index===Number($('#frame').value));const [iw,ih]=c?.resolution||[640,480],ratio=iw/ih;let vw=w,vh=w/ratio;if(vh>h){vh=h;vw=h*ratio}renderer.setViewport((w-vw)/2,(h-vh)/2,vw,vh)}else{renderer.setViewport(0,0,w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}}
function overview(){matched=false;controls.enabled=true;camera.up.set(0,1,0);const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();camera.position.copy(center).add(new THREE.Vector3(.7,.55,.8).multiplyScalar(size*.75));controls.target.copy(center);camera.fov=45;camera.updateProjectionMatrix();controls.update();resize()}
function match(){const c=data.cameras.find(c=>c.index===Number($('#frame').value));if(!c)return;matched=true;controls.enabled=false;const m=c.c2w;const matrix=new THREE.Matrix4().set(m[0][0],-m[0][1],-m[0][2],m[0][3],m[1][0],-m[1][1],-m[1][2],m[1][3],m[2][0],-m[2][1],-m[2][2],m[2][3],0,0,0,1);camera.position.setFromMatrixPosition(matrix);camera.quaternion.setFromRotationMatrix(matrix);const [fx,fy,cx,cy]=c.intrinsics,[w,h]=c.resolution||[640,480],n=.01,f=100;camera.projectionMatrix.set(2*fx/w,0,1-2*cx/w,0,0,2*fy/h,2*cy/h-1,0,0,0,-(f+n)/(f-n),-2*f*n/(f-n),0,0,-1,0);camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();resize()}
function frame(){const id=String($('#frame').value).padStart(3,'0');$('#source').src='evidence/frame_'+id+'.png';$('#render').src='renders/after_'+id+'.png';const path='comparisons/'+(overlay?'overlay_':'frame_')+id+'.jpg';$('#comparison').src=path;$('#comparisonLink').href=path;if(matched)match()}
$('#frame').onchange=frame;$('#match').onclick=match;$('#free').onclick=overview;$('#version').onchange=async()=>{await load($('#version').value);if(matched)match()};$('#overlay').onclick=()=>{overlay=!overlay;frame()};$('#asset').onchange=()=>{const a=data.assets.find(a=>a.id===$('#asset').value);if(a){$('#detail').src=a.file;$('#detailLink').href=a.file;$('#coverage').textContent='对照帧：'+a.frames.join(', ')+' · '+(a.frames.length>=3?'三个可见视角':'可见视角有限')}};
try{await load('after');overview();frame();if(data.assets.length){$('#asset').value=data.assets[0].id;$('#asset').onchange()}}catch(e){$('#status').textContent='模型加载失败：'+e.message;console.error(e)}
new ResizeObserver(resize).observe(host);renderer.setAnimationLoop(()=>{if(!matched)controls.update();renderer.render(scene,camera)});
</script></body></html>
