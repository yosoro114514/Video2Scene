<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频到 Blender · 实时运行监控</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111b21;color:#e5edf0;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:20px}h1{margin:0;font-size:24px}h2{font-size:18px;margin:0 0 12px}p{color:#aec0c9}a{color:#8cdbc3}button,select{background:#223942;color:inherit;border:1px solid #50666e;border-radius:6px;padding:7px 12px}section{background:#1a2b33;border:1px solid #36505c;border-radius:10px;padding:17px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:14px;background:#223942;border-radius:8px}.card small{display:block;color:#afc5ce}.card strong{font-size:20px}.bar{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.good{color:#9cddba}.bad{color:#ffb5a4}.muted{color:#adc0ca}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #334b56}code{word-break:break-word}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;background:#102028;padding:10px;border-radius:7px}img{width:100%;display:block;border-radius:6px}.links a{display:inline-block;margin:5px 16px 5px 0}footer{padding:10px 20px 30px;text-align:center;color:#9aafba}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}header,main{padding:10px}}</style>
<header><h1>视频 → GPT 直接操作 Blender · 实时监控</h1><p>读取真实阶段记录、模型事件与产物，每 2 秒刷新。模型尚未返回的内部推理不可见；文件无变化不等于已判定卡死。</p><div class="bar"><button id="pause">暂停显示</button><span id="updated"></span><a href="../reviewed/">最终查看器</a><a href="../">同相机基线</a></div></header>
<main><section><div class="grid"><div class="card"><small>记录中的当前阶段</small><strong id="stage">读取中</strong></div><div class="card"><small>版本／最大返修次数</small><strong id="round">—</strong></div><div class="card"><small>本次模型调用用时／超时</small><strong id="elapsed">—</strong></div><div class="card"><small>最近一次事件文件更新</small><strong id="activity">—</strong></div></div><p id="summary"></p></section>
<section><h2>最新实际对照</h2><div class="bar"><select id="version"></select><select id="frame"><option value="0">帧 0</option><option value="26">帧 26</option><option value="52">帧 52</option><option value="78">帧 78</option><option value="104">帧 104</option><option value="130">帧 130</option><option value="156">帧 156</option></select><a id="imageLink" target="_blank">打开大图</a></div><p id="imageNote">等待实际渲染。</p><img id="compare" hidden alt="视频、上一版、本版同相机对照"></section>
<section><h2>本轮执行记录</h2><div id="artifacts" class="links"></div><p id="toolCount"></p><pre id="lastAction">等待日志</pre></section>
<section><h2>最近完成的独立复核</h2><p id="reviewSummary">尚未收到复核结果。</p><div id="reviewIssues"></div></section>
<section><h2>阶段状态</h2><table><thead><tr><th>阶段</th><th>状态</th><th>耗时</th></tr></thead><tbody id="stages"></tbody></table></section></main>
<footer>只读观察器，不启动或停止模型、不触发重跑。“暂停显示”仅暂停浏览器刷新。视觉验收与文件检查分别记录。</footer>
<script>
const $=s=>document.querySelector(s);let paused=false,busy=false,selectedByUser=false,lastImage='';
async function get(path,type='json'){const r=await fetch('../'+path,{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+path);return {data:type==='json'?await r.json():await r.text(),modified:r.headers.get('Last-Modified')}}
async function exists(path){try{return (await fetch('../'+path,{method:'HEAD',cache:'no-store'})).ok}catch{return false}}
const seconds=t=>t<0?'—':Math.floor(t/60)+'分'+Math.floor(t%60)+'秒';
function image(){const n=$('#version').value;if(n==='')return;const p=`../direct/${n}/review/comparison_${String($('#frame').value).padStart(3,'0')}.jpg`;if(p!==lastImage){$('#compare').src=p;lastImage=p}$('#imageLink').href=p;$('#compare').hidden=false;$('#imageNote').textContent='左：视频；中：上一版模型；右：本版 GPT 模型。相机保持固定。'}
$('#version').onchange=()=>{selectedByUser=true;image()};$('#frame').onchange=image;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'继续显示':'暂停显示';if(!paused)refresh()};
async function refresh(){if(paused||busy)return;busy=true;try{
const {data:p}=await get('pipeline.json');const d=(await get('direct_pipeline.json').catch(()=>({data:{}}))).data;const entries=Object.entries(p.stages||{});const running=entries.filter(([k,v])=>v.status==='running').sort((a,b)=>b[1].started-a[1].started)[0];
const latest=entries.filter(([k,v])=>k.startsWith('direct_')).at(-1);const active=running||latest;$('#stage').textContent=active?active[0]:p.status;$('#stage').className=p.status==='failed'?'bad':p.status==='complete'?'good':'';
const m=active?.[0].match(/direct_(author|review|render|validate)_(\d+)/);const round=m?Number(m[2]):0;$('#round').textContent=(round===0?'首次建模':'返修 '+round)+' / 上限 '+(d.max_revisions??2);
$('#summary').textContent=`流程状态：${d.status||p.status}；视觉验收：${d.visual_acceptance||'尚未完成复核'}；停止原因：${d.stop_reason||'尚未停止'}。${d.error||''}`;
$('#stages').replaceChildren();for(const [k,v]of entries){const tr=document.createElement('tr');for(const x of [k,v.status,seconds(v.seconds??(v.status==='running'?Date.now()/1000-v.started:0))]){const td=document.createElement('td');td.textContent=x;tr.append(td)}$('#stages').append(tr)}
const completed=entries.filter(([k,v])=>/^direct_render_\d+$/.test(k)&&v.status==='complete').map(([k])=>k.slice(-2));const value=$('#version').value;$('#version').replaceChildren(...completed.map(n=>new Option(n==='00'?'首次建模':'返修 '+Number(n),n)));if(completed.length){$('#version').value=selectedByUser&&completed.includes(value)?value:completed.at(-1);image()}
const n=String(round).padStart(2,'0');const kind=m&&m[1]==='review'?'review':'author';const folder=`direct/${n}/${kind}`;const req=(await get(folder+'/request.json').catch(()=>({data:null}))).data;
if(req){const elapsed=req.seconds??(Date.now()/1000-req.started);$('#elapsed').textContent=seconds(elapsed)+' / 20分钟';$('#elapsed').className=req.status==='failed'?'bad':'';const log=await get(folder+'/events.jsonl','text');const ago=log.modified?(Date.now()-Date.parse(log.modified))/1000:-1;$('#activity').textContent=seconds(ago)+'前';
const events=log.data.split('\n').flatMap(line=>{try{return [JSON.parse(line)]}catch{return []}});const calls=events.filter(e=>e.type==='item.completed'&&e.item?.type==='command_execution');const last=calls.at(-1)?.item;$('#toolCount').textContent=`${req.requested_model} / ${req.reasoning_effort}；请求状态：${req.status}；已完成命令 ${calls.length} 次。模型内部思考不提供实时百分比。`;
$('#lastAction').textContent=last?`${last.status} / exit ${last.exit_code}\n${last.command}\n\n${(last.aggregated_output||'').slice(-2500)}`:'尚无命令事件；当前可能是只读视觉复核。';
}else{$('#elapsed').textContent='非模型阶段';$('#activity').textContent='—'}
$('#artifacts').replaceChildren();for(const [name,path]of [['本版交互查看器',`direct/${n}/result/index.html`],['GPT 建模脚本',`direct/${n}/author/model_scene.py`],['候选 Blender',`direct/${n}/author/candidate.blend`],['实际执行证据',`direct/${n}/author/execution_proof.json`],['本轮模型回复',folder+'/response.json'],['本轮调用记录',folder+'/request.json'],['GLB',`direct/${n}/result/model.glb`]]){if(await exists(path)){const a=document.createElement('a');a.href='../'+path;a.textContent=name;a.target='_blank';$('#artifacts').append(a)}}
const reviewed=(d.history||[]).at(-1);if(reviewed){const result=(await get(`direct/${String(reviewed.iteration).padStart(2,'0')}/review/response.json`)).data;$('#reviewSummary').textContent=`候选 ${reviewed.iteration}：${result.status}；${result.summary}`;$('#reviewIssues').replaceChildren();for(const issue of result.issues||[]){const p=document.createElement('p');p.textContent=`${issue.priority} · ${issue.asset_id} · 帧 ${issue.frames.join('、')}：${issue.evidence} 返修要求：${issue.requested_fix}`;$('#reviewIssues').append(p)}}
$('#updated').textContent='最后刷新 '+new Date().toLocaleTimeString();
}catch(e){$('#updated').textContent='等待状态文件：'+e.message}finally{busy=false}}
refresh();setInterval(refresh,2000);
</script></html>
